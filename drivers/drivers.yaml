# --driver <name> picks one entry. Model names, endpoints and key env vars live here and nowhere else.
claude:
  module: claude.ts
  key_env: ANTHROPIC_API_KEY
  model: claude-opus-5-5
  effort: low
  max_tokens: 16000

openai:
  module: openai-compatible.ts
  key_env: OPENAI_API_KEY
  model: gpt-5.5
  reasoning_effort: none # chat/completions rejects function tools with any other effort on this model

# Same driver, other OpenAI-compatible providers: add the key to .env and run --driver <name>.
deepseek:
  module: openai-compatible.ts
  key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  model: deepseek-chat

grok:
  module: openai-compatible.ts
  key_env: XAI_API_KEY
  base_url: https://api.x.ai/v1
  model: grok-4

gemini:
  module: openai-compatible.ts
  key_env: GEMINI_API_KEY
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  model: gemini-2.5-flash # pinned, not the -latest alias, so runs stay reproducible
